
name: Build MC Royale Menu

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
           gradle-version: '9.8.1'

      - name: Build mod
        run: |
          if [ -f build.gradle ]; then
            gradle build --no-daemon
          elif [ -f MCroyaleMenu/build.gradle ]; then
            cd MCroyaleMenu
            gradle build --no-daemon
          else
            echo "Could not find build.gradle"
            exit 1
          fi

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: mcroyale-menu
          path: |
            build/libs/*.jar
            MCroyaleMenu/build/libs/*.jar
          if-no-files-found: error
